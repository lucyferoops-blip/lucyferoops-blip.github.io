<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Majid Dev | Terminal Portfolio</title>
    <style>
        :root {
            --neon-primary: #0ff;
            --neon-secondary: #c200ff;
            --glow-color: rgba(0, 255, 255, 0.6);
            --bg-color: #0a0a0f;
            --text-color: #c0f0ff;
            --heading-color: #ff79c6;
            --highlight-color: #ffb86c;
            --prompt-color: #0ff;
            --progress-bg: #1a1a2e;
            --progress-fill: #0ff;
            --terminal-bg: rgba(10, 10, 25, 0.75);
            --border-glow: rgba(0, 255, 255, 0.3);
            --hover-glow: rgba(0, 255, 255, 0.3);
            --noise-opacity: 0.03;
            --crt-opacity: 0.08;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-color);
            font-family: 'Fira Code', 'Courier New', monospace;
            overflow-x: hidden;
            height: 100vh;
            position: relative;
            cursor: default;
            -webkit-tap-highlight-color: transparent;
        }

        .mouse-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(circle 300px at var(--mouse-x, 0) var(--mouse-y, 0), rgba(0, 255, 255, 0.08), transparent 70%);
            transition: opacity 0.3s;
            will-change: background;
        }

        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: var(--noise-opacity);
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.4'/%3E%3C/svg%3E");
            background-size: 200px 200px;
        }

        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .scroll-sections {
            position: relative;
            z-index: 1;
            pointer-events: none;
        }
        .scroll-sections section {
            height: 100vh;
            width: 100%;
            pointer-events: auto;
        }

        .terminal-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) translateZ(0);
            width: min(90%, 850px);
            max-height: 80vh;
            background: var(--terminal-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.15), 0 0 15px rgba(200, 0, 255, 0.2);
            z-index: 2;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: transform 0.3s ease, filter 0.3s ease, box-shadow 0.3s, border-color 0.3s;
            will-change: transform, filter;
        }

        .terminal-container:hover {
            box-shadow: 0 0 50px var(--hover-glow), 0 0 25px rgba(200, 0, 255, 0.4);
            border-color: rgba(200, 0, 255, 0.6);
        }

        .section-transition {
            transform: translate(-50%, -50%) scale(0.98) rotate(0.5deg) translateZ(0);
            filter: blur(1px);
            opacity: 0.8;
        }

        .terminal-header {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: rgba(20, 20, 35, 0.7);
            border-bottom: 1px solid var(--border-glow);
            gap: 8px;
        }

        .btn {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: inline-block;
        }
        .close { background: #ff5f56; }
        .minimize { background: #ffbd2e; }
        .maximize { background: #27ca40; }

        .title {
            margin-left: 12px;
            color: #a0b0ff;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        .terminal-body {
            flex: 1;
            padding: 16px 20px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            font-size: 1rem;
            line-height: 1.6;
            color: var(--text-color);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .terminal-body::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0, 255, 255, 0.03) 0px, rgba(0, 255, 255, 0.03) 1px, transparent 1px, transparent 3px);
            pointer-events: none;
            z-index: 3;
            opacity: var(--crt-opacity);
        }

        .output {
            white-space: pre-wrap;
            word-break: break-word;
            flex: 1;
            position: relative;
            z-index: 1;
        }

        .prompt-text {
            color: var(--prompt-color);
            text-shadow: 0 0 8px var(--glow-color);
        }

        .output-text {
            color: var(--text-color);
        }

        .heading {
            color: var(--heading-color);
            font-weight: bold;
            text-shadow: 0 0 6px var(--heading-color);
        }

        .highlight {
            color: var(--highlight-color);
        }

        .glitch {
            display: inline-block;
            animation: glitch 1.5s infinite linear alternate-reverse;
            will-change: text-shadow;
        }

        @keyframes glitch {
            0% { text-shadow: 2px 2px 0 #ff00c1, -2px -2px 0 #00ffff; }
            20% { text-shadow: -2px 2px 0 #ff00c1, 2px -2px 0 #00ffff; }
            40% { text-shadow: 2px -2px 0 #ff00c1, -2px 2px 0 #00ffff; }
            60% { text-shadow: -2px -2px 0 #ff00c1, 2px 2px 0 #00ffff; }
            80% { text-shadow: 2px 2px 0 #00ffff, -2px -2px 0 #ff00c1; }
            100% { text-shadow: 2px -2px 0 #00ffff, -2px 2px 0 #ff00c1; }
        }

        .terminal-container {
            animation: flicker 0.15s infinite alternate;
        }
        @keyframes flicker {
            0% { opacity: 0.98; }
            100% { opacity: 1; }
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 2px 0;
        }
        .progress-label {
            color: var(--text-color);
            white-space: nowrap;
            min-width: 160px;
        }
        .progress-bar {
            flex: 1;
            height: 1.2em;
            background: var(--progress-bg);
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid rgba(0,255,255,0.2);
        }
        .progress-fill {
            height: 100%;
            width: 0;
            background: var(--progress-fill);
            border-radius: 3px;
            transition: width 1.2s ease-out;
            box-shadow: 0 0 10px var(--glow-color);
        }

        .scroll-indicator {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateZ(0);
            z-index: 5;
            color: rgba(0, 255, 255, 0.7);
            font-family: 'Fira Code', monospace;
            text-align: center;
            animation: bounce 1.5s infinite;
            transition: opacity 0.5s;
            pointer-events: none;
            font-size: 0.9rem;
            will-change: transform;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0) translateZ(0); }
            50% { transform: translateX(-50%) translateY(-8px) translateZ(0); }
        }

        /* Language switcher */
        .lang-switch {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 10;
            background: rgba(10, 10, 25, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 255, 255, 0.5);
            border-radius: 50px;
            padding: 8px 16px;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.25), 0 0 10px rgba(200, 0, 255, 0.2);
            color: var(--neon-primary);
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-shadow: 0 0 6px var(--glow-color);
            user-select: none;
        }

        .lang-switch:hover {
            box-shadow: 0 0 35px rgba(0, 255, 255, 0.5), 0 0 20px rgba(200, 0, 255, 0.4);
            border-color: rgba(0, 255, 255, 0.8);
        }

        /* Clickable terminal links */
        .terminal-link {
            color: var(--highlight-color);
            text-decoration: none;
            border-bottom: 1px dashed var(--highlight-color);
            transition: text-shadow 0.2s;
        }
        .terminal-link:hover {
            text-shadow: 0 0 8px var(--highlight-color);
            border-bottom-style: solid;
        }

        @media (max-width: 600px) {
            .terminal-container {
                width: 95%;
                max-height: 75vh;
            }
            .terminal-body {
                font-size: 0.85rem;
                padding: 12px;
            }
            .scroll-indicator {
                bottom: 20px;
                font-size: 0.8rem;
            }
            .progress-label {
                min-width: 120px;
            }
            .lang-switch {
                top: 16px;
                right: 16px;
                padding: 6px 12px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>

    (function() {
        const mouseGlow = document.getElementById('mouseGlow');
        document.addEventListener('mousemove', (e) => {
            mouseGlow.style.setProperty('--mouse-x', e.clientX + 'px');
            mouseGlow.style.setProperty('--mouse-y', e.clientY + 'px');
        });

        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        let width, height, lines = [];
        const BASE_FONT_SIZE = 13;
        const LINE_HEIGHT_RATIO = 1.4;
        let lineHeight = BASE_FONT_SIZE * LINE_HEIGHT_RATIO;

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            const fontSize = width < 600 ? 11 : BASE_FONT_SIZE;
            lineHeight = fontSize * LINE_HEIGHT_RATIO;
            initLines(fontSize);
        }

        const prefixes = ['[INFO]','[WARN]','[DEBUG]','[LOG]','root@server:~#','guest@majid:~$','>>>','...','OK','FAIL','200','404','import','def','class','return','if __name__'];
        const suffixes = ['Processing...','Done.','Connection established.','Loading module...','Syntax error near line 42.','Task completed successfully.','fetching data from api.github.com','Running security scan...','Open port 443 detected.','Encrypting payload...','Decrypting response...','Access granted.','Permission denied.','Uploading 4.2MB...','Downloading 6.7MB...','Cache cleared.','Server response: 200 OK','Memory usage: 78%','CPU load: 45%','Listening on 0.0.0.0:8080','User authenticated.'];

        function randomLine() {
            return prefixes[Math.random() * prefixes.length | 0] + ' ' + suffixes[Math.random() * suffixes.length | 0];
        }

        function initLines(fontSize) {
            const numLines = Math.ceil(height / lineHeight) + 5;
            lines.length = 0;
            for (let i = 0; i < numLines; i++) {
                lines.push({
                    text: randomLine(),
                    y: i * lineHeight,
                    speed: 0.3 + Math.random() * 0.7,
                    x: 10 + Math.random() * 30,
                    opacity: 0.05 + Math.random() * 0.15
                });
            }
        }

        let lastDrawTime = 0;
        const FRAME_THROTTLE = 1000/30;

        function drawLines(now) {
            if (now - lastDrawTime < FRAME_THROTTLE) {
                requestAnimationFrame(drawLines);
                return;
            }
            lastDrawTime = now;

            ctx.clearRect(0, 0, width, height);
            const fontSize = width < 600 ? 11 : BASE_FONT_SIZE;
            ctx.font = `${fontSize}px 'Fira Code', monospace`;

            for (let i = 0; i < lines.length; i++) {
                const l = lines[i];
                l.y -= l.speed;
                if (l.y + lineHeight < 0) {
                    l.y = height + Math.random() * 50;
                    l.text = randomLine();
                    l.speed = 0.3 + Math.random() * 0.7;
                    l.opacity = 0.05 + Math.random() * 0.15;
                }
                ctx.globalAlpha = l.opacity;
                ctx.fillStyle = '#0ff';
                ctx.fillText(l.text, l.x, l.y);
            }
            ctx.globalAlpha = 1;
            requestAnimationFrame(drawLines);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        requestAnimationFrame(drawLines);

        // ---------- Terminal Typewriter ----------
        const outputDiv = document.getElementById('output');
        const terminalBody = document.getElementById('terminalBody');
        const terminalContainer = document.getElementById('terminalContainer');
        const scrollIndicator = document.getElementById('scrollIndicator');
        const langSwitch = document.getElementById('langSwitch');
        let typingTimeout = null;
        let currentLang = 'en';
        let currentSectionIndex = 0;
        let completedSections = new Set();

        function appendChar(cls, char) {
            const span = document.createElement('span');
            span.className = cls;
            span.appendChild(document.createTextNode(char));
            outputDiv.appendChild(span);
        }

        function appendElement(element) {
            outputDiv.appendChild(element);
        }

        function typeSegments(segments, onComplete) {
            if (!segments || segments.length === 0) {
                if (onComplete) onComplete();
                return;
            }
            let segIdx = 0;
            let charIdx = 0;

            function nextChar() {
                if (segIdx >= segments.length) {
                    if (onComplete) onComplete();
                    return;
                }
                const seg = segments[segIdx];

                if (seg.type === 'progress') {
                    const container = document.createElement('div');
                    container.className = 'progress-container';
                    const label = document.createElement('span');
                    label.className = 'progress-label';
                    label.textContent = seg.label;
                    const bar = document.createElement('div');
                    bar.className = 'progress-bar';
                    const fill = document.createElement('div');
                    fill.className = 'progress-fill';
                    bar.appendChild(fill);
                    container.appendChild(label);
                    container.appendChild(bar);
                    appendElement(container);
                    setTimeout(() => { fill.style.width = seg.percent + '%'; }, 10);
                    segIdx++;
                    charIdx = 0;
                    typingTimeout = setTimeout(nextChar, 200);
                    return;
                }

                if (seg.type === 'link') {
                    const a = document.createElement('a');
                    a.href = seg.url;
                    a.target = '_blank';
                    a.className = 'terminal-link';
                    a.textContent = seg.text;
                    appendElement(a);
                    segIdx++;
                    charIdx = 0;
                    typingTimeout = setTimeout(nextChar, seg.nextDelay || 0);
                    return;
                }

                if (seg.type === 'html') {
                    const wrapper = document.createElement('span');
                    wrapper.innerHTML = seg.html;
                    appendElement(wrapper);
                    segIdx++;
                    charIdx = 0;
                    typingTimeout = setTimeout(nextChar, seg.nextDelay || 0);
                    return;
                }

                if (charIdx >= seg.text.length) {
                    segIdx++;
                    charIdx = 0;
                    const delay = seg.nextDelay || 0;
                    typingTimeout = setTimeout(nextChar, delay || 0);
                    return;
                }
                appendChar(seg.cls, seg.text.charAt(charIdx));
                charIdx++;
                terminalBody.scrollTop = terminalBody.scrollHeight;
                typingTimeout = setTimeout(nextChar, seg.speed || 18);
            }
            nextChar();
        }

            clearTimeout(typingTimeout);
            typingTimeout = null;

                { cls:'output-text', text:'یک پروژه پایتون ماژولار برای تحلیل امنیت و اتوماسیون.\n', speed:18 },
                { cls:'prompt-text', text:'guest@majid:~$' }
            ],
            // 3 - whoami
            [
                { cls:'prompt-text', text:'guest@majid:~$' },
                { cls:'output-text', text:' whoami\n', speed:18 },
                { cls:'heading', text:'مجید\n', speed:18 },
                { cls:'output-text', text:'توسعه‌دهنده پایتون\nبرنامه‌نویس بک‌اند\nعلاقه‌مند به امنیت سایبری\n\n', speed:18 },
                { cls:'output-text', text:'وضعیت فعلی:\n', speed:18 },
                { cls:'output-text', text:'🟢 آماده برای پروژه‌های جدید\n', speed:18 },
                { cls:'output-text', text:'🟢 باز برای کار فریلنسری\n', speed:18 },
                { cls:'output-text', text:'🟢 آماده ساخت ایده بعدی شما\n\n', speed:18 },

            // 4 - Contact
            [

                { cls:'output-text', text:' contact\n', speed:18 },

                { type:'link', url:'https://t.me/M4j1D_0xDEAD', text:'@M4j1D_0xDEAD', nextDelay:0 },
                { cls:'output-text', text:'\nگیتهاب   : ', speed:18 },
                { type:'link', url:'https://github.com/lucyferoops-blip', text:'github.com/lucyferoops-blip', nextDelay:0 },
                { cls:'output-text', text:'\n\nآماده ساخت پروژه بعدی شما.\n', speed:18 },

            ]
        ];

        function getSectionsForLang(lang) {
            return lang === 'fa' ? sectionsFa : sectionsEn;
        }

        function startAutoSection(index, lang = currentLang) {
            if (completedSections.has(index)) return;
            stopTyping();
            const content = getSectionsForLang(lang)[index];
            if (index > 0) appendChar('output-text', '\n');
            typeSegments(content, () => completedSections.add(index));
        }

        const sections = document.querySelectorAll('.scroll-sections section');
        function getCurrentIndex() {
            return Math.min(Math.round(window.scrollY / window.innerHeight), sections.length - 1);
        }

        let lastSection = -1;
        function handleScroll() {
            const idx = getCurrentIndex();
            if (idx !== lastSection) {
                stopTyping();
                terminalContainer.classList.add('section-transition');
                setTimeout(() => terminalContainer.classList.remove('section-transition'), 300);
                lastSection = idx;
                currentSectionIndex = idx;
                startAutoSection(idx, currentLang);
            }
            scrollIndicator.style.opacity = window.scrollY > 50 ? '0' : '1';
        }

        function switchLanguage(newLang) {
            if (newLang === currentLang) return;
            stopTyping();
            outputDiv.innerHTML = '';
            completedSections.clear();
            currentLang = newLang;
            langSwitch.textContent = newLang === 'fa' ? 'EN' : 'FA';
            lastSection = currentSectionIndex;
            startAutoSection(currentSectionIndex, newLang);
        }

        langSwitch.addEventListener('click', () => {
            const nextLang = currentLang === 'en' ? 'fa' : 'en';
            switchLanguage(nextLang);
        });

        window.addEventListener('load', () => {
            window.scrollTo(0, 0);
            lastSection = 0;
            currentSectionIndex = 0;
            startAutoSection(0, 'en');
            langSwitch.textContent = 'FA';
        });

        let ticking = false;
        window.addEventListener('scroll', () => {
            if (!ticking) {
                requestAnimationFrame(() => { handleScroll(); ticking = false; });
                ticking = true;
            }
        }, { passive: true });
    })();
    </script>
