<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Majid Dev | Terminal Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            font-family: 'Fira Code', 'Courier New', monospace;
            overflow-x: hidden;
            height: 100vh;
            position: relative;
            -webkit-tap-highlight-color: transparent;
            cursor: default;
        }

        /* Mouse glow (desktop only) */
        @media (hover: hover) and (pointer: fine) {
            .mouse-glow {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                z-index: 0;
                background: radial-gradient(circle 300px at var(--mouse-x, 0) var(--mouse-y, 0), rgba(0, 255, 255, 0.08), transparent 70%);
                transition: opacity 0.3s;
            }
        }

        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .scroll-sections {
            position: relative;
            z-index: 1;
            pointer-events: none;
        }

        .scroll-sections section {
            height: 100vh;
            width: 100%;
            pointer-events: auto;
        }

        .terminal-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(90%, 850px);
            max-height: 75vh;
            background: rgba(10, 10, 25, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 16px;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.15), 0 0 15px rgba(200, 0, 255, 0.2);
            z-index: 2;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: box-shadow 0.3s, border-color 0.3s;
        }

        .terminal-container:hover {
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.3), 0 0 25px rgba(200, 0, 255, 0.4);
            border-color: rgba(200, 0, 255, 0.6);
        }

        .terminal-header {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: rgba(20, 20, 35, 0.7);
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
            gap: 8px;
            flex-shrink: 0;
        }

        .btn {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: inline-block;
        }

        .close { background: #ff5f56; }
        .minimize { background: #ffbd2e; }
        .maximize { background: #27ca40; }

        .title {
            margin-left: 12px;
            color: #a0b0ff;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        .terminal-body {
            flex: 1;
            padding: 16px 20px;
            overflow-y: auto;
            font-size: 1rem;
            line-height: 1.6;
            color: #c0f0ff;
            position: relative;
            display: flex;
            flex-direction: column;
            -webkit-overflow-scrolling: touch;
        }

        /* Scanline effect */
        .terminal-body::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0, 255, 255, 0.02) 0px, rgba(0, 255, 255, 0.02) 1px, transparent 1px, transparent 3px);
            pointer-events: none;
            z-index: 3;
        }

        .output {
            white-space: pre-wrap;
            word-break: break-word;
            flex: 1;
            position: relative;
            z-index: 1;
        }

        .prompt-text {
            color: #0ff;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.6);
        }

        .cmd {
            color: #e0b0ff;
            font-weight: bold;
        }

        .output-text {
            color: #c0f0ff;
        }

        .heading {
            color: #ff79c6;
            font-weight: bold;
            text-shadow: 0 0 6px #ff79c6;
        }

        .highlight {
            color: #ffb86c;
        }

        .glitch {
            display: inline-block;
            animation: glitch 1.5s infinite linear alternate-reverse;
        }

        @keyframes glitch {
            0% { text-shadow: 2px 2px 0 #ff00c1, -2px -2px 0 #00ffff; }
            20% { text-shadow: -2px 2px 0 #ff00c1, 2px -2px 0 #00ffff; }
            40% { text-shadow: 2px -2px 0 #ff00c1, -2px 2px 0 #00ffff; }
            60% { text-shadow: -2px -2px 0 #ff00c1, 2px 2px 0 #00ffff; }
            80% { text-shadow: 2px 2px 0 #00ffff, -2px -2px 0 #ff00c1; }
            100% { text-shadow: 2px -2px 0 #00ffff, -2px 2px 0 #ff00c1; }
        }

        .cursor-blink {
            display: inline-block;
            background: #0ff;
            color: transparent;
            width: 0.6em;
            animation: blink 1s step-end infinite;
            vertical-align: text-bottom;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .interactive-line {
            display: flex;
            align-items: center;
            margin-top: 8px;
            border-top: 1px dashed rgba(0,255,255,0.2);
            padding-top: 8px;
            z-index: 1;
            flex-shrink: 0;
        }

        #commandInput {
            background: transparent;
            border: none;
            color: #c0f0ff;
            font-family: 'Fira Code', monospace;
            font-size: 1rem;
            flex: 1;
            outline: none;
            caret-color: #0ff;
            margin-left: 8px;
            -webkit-appearance: none;
        }

        .scroll-indicator {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            color: rgba(0, 255, 255, 0.7);
            font-family: 'Fira Code', monospace;
            text-align: center;
            animation: bounce 1.5s infinite;
            transition: opacity 0.5s;
            pointer-events: none;
            font-size: 0.9rem;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-8px); }
        }

        /* Flicker effect for whole terminal */
        .terminal-container {
            animation: flicker 0.15s infinite alternate;
        }

        @keyframes flicker {
            0% { opacity: 0.98; }
            100% { opacity: 1; }
        }

        /* Contact bar outside terminal */
        .contact-bar {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 10;
            background: rgba(10, 10, 25, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 8px 20px;
            border-radius: 40px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }

        .contact-icon {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, filter 0.2s;
        }

        .contact-icon:hover {
            transform: scale(1.2);
            filter: drop-shadow(0 0 8px #0ff);
        }

        .contact-icon svg {
            width: 24px;
            height: 24px;
            fill: rgba(0, 255, 255, 0.8);
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .terminal-container {
                width: 95%;
                max-height: 70vh;
                top: 45%;
            }
            .terminal-body {
                font-size: 0.85rem;
                padding: 12px;
            }
            .scroll-indicator {
                bottom: 80px;
                font-size: 0.8rem;
            }
            .contact-bar {
                gap: 16px;
                padding: 6px 16px;
                bottom: 10px;
            }
            .contact-icon svg {
                width: 22px;
                height: 22px;
            }
            .title {
                font-size: 0.75rem;
            }
            #commandInput {
                font-size: 0.85rem;
            }
        }

        @media (max-width: 400px) {
            .terminal-body {
                font-size: 0.8rem;
                padding: 10px;
            }
            .contact-bar {
                gap: 12px;
                padding: 4px 12px;
            }
        }
    </style>
</head>
<body>

    <script>
        (function() {
            // ---------- Mouse glow ----------
            const mouseGlow = document.getElementById('mouseGlow');
            if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
                document.addEventListener('mousemove', (e) => {
                    mouseGlow.style.setProperty('--mouse-x', e.clientX + 'px');
                    mouseGlow.style.setProperty('--mouse-y', e.clientY + 'px');
                });
            } else {
                mouseGlow.style.display = 'none';
            }

            // ---------- ذرات پس‌زمینه (کاهش در موبایل) ----------
            const canvas = document.getElementById('particleCanvas');
            const ctx = canvas.getContext('2d');
            let particles = [];
            const isMobile = window.innerWidth < 768;
            const particleCount = isMobile ? 30 : 80;
            const connectionDistance = isMobile ? 80 : 120;

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            class Particle {
                constructor() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.vx = (Math.random() - 0.5) * 0.6;
                    this.vy = (Math.random() - 0.5) * 0.6;
                    this.radius = Math.random() * 2 + 1;
                    this.opacity = Math.random() * 0.5 + 0.3;
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                    if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(0, 255, 255, ${this.opacity})`;
                    ctx.fill();
                }
            }

            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }

            function connectParticles() {
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < connectionDistance) {
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = `rgba(180, 0, 255, ${0.15 * (1 - dist / connectionDistance)})`;
                            ctx.lineWidth = 0.6;
                            ctx.stroke();
                        }
                    }
                }
            }

            function animateParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.update();
                    p.draw();
                });
                connectParticles();
                requestAnimationFrame(animateParticles);
            }
            animateParticles();

            // ---------- مدیریت ترمینال ----------
            const outputDiv = document.getElementById('output');
            const terminalBody = document.getElementById('terminalBody');
            const commandInput = document.getElementById('commandInput');
            const scrollIndicator = document.getElementById('scrollIndicator');
            let typingInterval = null;
            let isTyping = false;
            let manualMode = false;
            const completedSections = new Set();

            const sectionsContent = [
                [
                    { cls: 'prompt-text', text: 'guest@majid:~$' },
                    { cls: 'output-text', text: ' cat about.txt\n' },
                    { cls: 'output-text', text: 'Loading... [████████████] 100%\n\n' },
                    { cls: 'heading glitch', text: 'Majid' },
                    { cls: 'output-text', text: '\n' },
                    { cls: 'highlight', text: 'Python Developer | Backend Developer | Cyber Security Enthusiast\n\n' },
                    { cls: 'output-text', text: 'I build secure, scalable backend systems with Python.\nPassionate about open-source, automation, and ethical hacking.\nTurning coffee into code since forever.\n' },
                    { cls: 'prompt-text', text: 'guest@majid:~$' }
                ],
                [
                    { cls: 'prompt-text', text: 'guest@majid:~$' },
                    { cls: 'output-text', text: ' skills --list\n' },
                    { cls: 'output-text', text: 'Initializing... [████████] 100%\n\n' },
                    { cls: 'heading', text: 'Languages:' },
                    { cls: 'output-text', text: '  Python, JavaScript, Bash\n' },
                    { cls: 'heading', text: 'Frameworks:' },
                    { cls: 'output-text', text: '  FastAPI, Django, Flask\n' },
                    { cls: 'heading', text: 'Databases:' },
                    { cls: 'output-text', text: '  PostgreSQL, SQLite, Redis\n' },
                    { cls: 'heading', text: 'DevOps & Tools:' },
                    { cls: 'output-text', text: '  Linux, Docker, Git, GitHub Actions\n' },
                    { cls: 'heading', text: 'Specialties:' },
                    { cls: 'output-text', text: '  Telegram Bot, REST API, Cyber Security\n' },
                    { cls: 'prompt-text', text: 'guest@majid:~$' }
                ],
                [
                    { cls: 'prompt-text', text: 'guest@majid:~$' },
                    { cls: 'output-text', text: ' ls projects/\n' },
                    { cls: 'highlight', text: 'telegram-superbot  HackerLab  Jamshid-AI  Portfolio\n\n' },
                    { cls: 'prompt-text', text: 'guest@majid:~$' },
                    { cls: 'output-text', text: ' cd HackerLab\n' },
                    { cls: 'prompt-text', text: 'guest@majid:~/HackerLab$' },
                    { cls: 'output-text', text: ' tree\n' },
                    { cls: 'output-text', text: 'HackerLab/\n├── scanner.py\n├── exploit.py\n├── payloads/\n│   ├── reverse_shell.py\n│   └── keylogger.py\n├── requirements.txt\n└── README.md\n\n' },
                    { cls: 'output-text', text: 'A modular penetration testing toolkit for educational purposes.\n' },
                    { cls: 'prompt-text', text: 'guest@majid:~$' }
                ],
                [
                    { cls: 'prompt-text', text: 'guest@majid:~$' },
                    { cls: 'output-text', text: ' whoami\n' },
                    { cls: 'heading', text: 'Majid\n' },
                    { cls: 'output-text', text: 'Python Developer\nBackend Developer\nOpen Source Enthusiast\nAlways Building Something...\n\n' },
                    { cls: 'prompt-text', text: 'guest@majid:~$' },
                    { cls: 'output-text', text: ' exit\n' },
                    { cls: 'output-text', text: 'logout\n' },
                    { cls: 'output-text', text: 'Connection Closed...\n' },
                ]
            ];

            function appendChar(cls, char) {
                const span = document.createElement('span');
                span.className = cls;
                span.textContent = char;
                outputDiv.appendChild(span);
            }

            function appendElement(element) {
                outputDiv.appendChild(element);
            }

            function typeSegments(segments, callback) {
                if (!segments || segments.length === 0) {
                    if (callback) callback();
                    return;
                }
                let segIdx = 0;
                let charIdx = 0;

                function nextChar() {
                    if (segIdx >= segments.length) {
                        if (callback) callback();
                        return;
                    }
                    const seg = segments[segIdx];
                    if (charIdx >= seg.text.length) {
                        segIdx++;
                        charIdx = 0;
                        nextChar();
                        return;
                    }
                    const ch = seg.text[charIdx];
                    appendChar(seg.cls, ch);
                    charIdx++;
                    terminalBody.scrollTop = terminalBody.scrollHeight;
                    typingInterval = setTimeout(nextChar, 18);
                }
                nextChar();
            }

            function stopTyping() {
                if (typingInterval) {
                    clearTimeout(typingInterval);
                    typingInterval = null;
                }
            }

            function startAutoSection(index) {
                if (completedSections.has(index) || manualMode) return;
                completedSections.add(index);
                const content = sectionsContent[index];
                if (index > 0) {
                    appendChar('output-text', '\n');
                }
                typeSegments(content, () => {
                    if (index === sectionsContent.length - 1) {
                        commandInput.disabled = false;
                        commandInput.focus();
                    }
                });
            }

            const sections = document.querySelectorAll('.scroll-sections section');
            function getCurrentIndex() {
                const scrollY = window.scrollY;
                const vh = window.innerHeight;
                const index = Math.round(scrollY / vh);
                return Math.min(index, sections.length - 1);
            }

            let lastSection = -1;
            function handleScroll() {
                if (manualMode) return;
                const idx = getCurrentIndex();
                if (idx !== lastSection) {
                    lastSection = idx;
                    startAutoSection(idx);
                }
                if (window.scrollY > 50) {
                    scrollIndicator.style.opacity = '0';
                } else {
                    scrollIndicator.style.opacity = '1';
                }
            }

            window.addEventListener('load', () => {
                window.scrollTo(0, 0);
                lastSection = 0;
                startAutoSection(0);
                commandInput.disabled = true;
            });

            let ticking = false;
            window.addEventListener('scroll', () => {
                if (!ticking) {
                    window.requestAnimationFrame(() => {
                        handleScroll();
                        ticking = false;
                    });
                    ticking = true;
                }
            });

            // ---------- حالت تعاملی ----------
            commandInput.addEventListener('focus', () => {
                if (!manualMode) {
                    manualMode = true;
                    stopTyping();
                    commandInput.disabled = false;
                    scrollIndicator.style.opacity = '0';
                    appendChar('output-text', '\n');
                    appendChar('prompt-text', 'guest@majid:~$ ');
                }
            });

            commandInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    const cmd = commandInput.value.trim();
                    if (cmd === '') return;
                    commandInput.value = '';
                    commandInput.disabled = true;
                    appendChar('prompt-text', 'guest@majid:~$ ');
                    appendChar('output-text', cmd + '\n');
                    processCommand(cmd);
                }
            });

            function processCommand(cmd) {
                const lower = cmd.toLowerCase().trim();
                let outputSegments = [];
                switch (lower) {
                    case 'help':
                        outputSegments = [
                            { cls: 'heading', text: 'Available commands:\n' },
                            { cls: 'output-text', text: '  about      - About me\n' },
                            { cls: 'output-text', text: '  skills     - Technical skills\n' },
                            { cls: 'output-text', text: '  projects   - My projects\n' },
                            { cls: 'output-text', text: '  contact    - Find me elsewhere\n' },
                            { cls: 'output-text', text: '  whoami     - Identity\n' },
                            { cls: 'output-text', text: '  clear      - Clear terminal\n' },
                            { cls: 'output-text', text: '  help       - This help\n' }
                        ];
                        break;
                    case 'about':
                        outputSegments = [
                            { cls: 'output-text', text: 'Loading about.txt...\n' },

                        break;
                    case 'skills':
                        outputSegments = [
                            { cls: 'output-text', text: 'Fetching skill matrix...\n' },
                            { cls: 'heading', text: 'Languages:' },
                            { cls: 'output-text', text: '  Python, JavaScript, Bash\n' },
                            { cls: 'heading', text: 'Frameworks:' },
                            { cls: 'output-text', text: '  FastAPI, Django, Flask\n' },
                            { cls: 'heading', text: 'Databases:' },

                            { cls: 'heading', text: 'DevOps & Tools:' },
                            { cls: 'output-text', text: '  Linux, Docker, Git, GitHub Actions\n' },
                            { cls: 'heading', text: 'Specialties:' },
                            { cls: 'output-text', text: '  Telegram Bot, REST API, Cyber Security\n' }
                        ];
                        break;
                    case 'projects':
                        outputSegments = [
                            { cls: 'output-text', text: 'Listing projects...\n' },
                            { cls: 'highlight', text: 'telegram-superbot  HackerLab  Jamshid-AI  Portfolio\n\n' },

                    case 'contact':

                            { cls: 'highlight', text: 'Check the floating icons at the bottom.\n' }
                        ];
                        break;
                    case 'whoami':
                        outputSegments = [
                            { cls: 'output-text', text: 'Identity confirmed:\n' },
                            { cls: 'heading', text: 'Majid\n' },
                            { cls: 'output-text', text: 'Python Developer\nBackend Developer\nOpen Source Enthusiast\nAlways Building Something...\n' }
                        ];
                        break;
                    case 'clear':
                        outputDiv.innerHTML = '';
                        appendChar('prompt-text', 'guest@majid:~$ ');
                        commandInput.disabled = false;
                        commandInput.focus();
                        return;
                    default:
                        outputSegments = [
                            { cls: 'output-text', text: `command not found: ${cmd}\n` },
                            { cls: 'output-text', text: 'Type "help" for available commands.\n' }
                        ];
                }
                typeSegments(outputSegments, () => {
                    appendChar('prompt-text', 'guest@majid:~$ ');
                    commandInput.disabled = false;
                    commandInput.focus();
                });
            }
        })();
