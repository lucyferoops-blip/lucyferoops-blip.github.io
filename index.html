    <style>
        :root {
            --bg: #0a0a0f; --terminal-bg: rgba(10,10,25,0.85); --border: rgba(0,255,255,0.3);
            --text: #c0f0ff; --prompt: #0ff; --heading: #ff79c6; --highlight: #ffb86c; --neon: #0ff;
        }
        .theme-hacker { --bg:#000; --terminal-bg:rgba(0,0,0,0.92); --border:#0f0; --text:#0f0; --prompt:#0f0; --heading:#0f0; --highlight:#0f0; --neon:#0f0; }
        .theme-cyberpunk { --bg:#0d0221; --terminal-bg:rgba(20,0,40,0.85); --border:#f0f; --text:#ffb3ff; --prompt:#f0f; --heading:#f0c; --highlight:#ff0; --neon:#f0f; }
        .theme-dracula { --bg:#282a36; --terminal-bg:rgba(40,42,54,0.9); --border:#bd93f9; --text:#f8f8f2; --prompt:#50fa7b; --heading:#ff79c6; --highlight:#f1fa8c; --neon:#bd93f9; }
        .theme-nord { --bg:#2e3440; --terminal-bg:rgba(46,52,64,0.9); --border:#88c0d0; --text:#d8dee9; --prompt:#81a1c1; --heading:#b48ead; --highlight:#ebcb8b; --neon:#88c0d0; }
        .theme-tokyonight { --bg:#1a1b27; --terminal-bg:rgba(26,27,39,0.9); --border:#7aa2f7; --text:#c0caf5; --prompt:#7dcfff; --heading:#bb9af7; --highlight:#e0af68; --neon:#7aa2f7; }
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            background:var(--bg); font-family:'Vazir Code','Fira Code',monospace; height:100vh; overflow:hidden;
            position:relative; -webkit-tap-highlight-color:transparent; transition:background .3s, color .3s;
        }
        #bootScreen{position:fixed;inset:0;background:#000;color:#0f0;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:1000;font-family:'Courier New',monospace;transition:opacity .8s;pointer-events:all;padding:20px;}
        #bootScreen.hidden{opacity:0;pointer-events:none}
        .boot-line{white-space:pre-wrap;margin:2px 0}
        canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
        #matrixCanvas{display:none}
        .scroll-container{position:fixed;top:0;left:0;width:100%;height:100%;overflow-y:auto;z-index:1;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
        .scroll-sections{height:100%}
        .scroll-sections section{height:100vh;width:100%;pointer-events:auto}
        .terminal-wrapper{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(92%,900px);max-height:78vh;z-index:2;display:flex;flex-direction:column;background:var(--terminal-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:16px;box-shadow:0 0 40px rgba(0,255,255,0.15);transition:border-color .3s,box-shadow .3s}
        .terminal-header{display:flex;align-items:center;padding:10px 16px;background:rgba(0,0,0,0.4);border-bottom:1px solid var(--border);gap:8px;flex-shrink:0}
        .win-btn{width:12px;height:12px;border-radius:50%}
        .close{background:#ff5f56}.minimize{background:#ffbd2e}.maximize{background:#27ca40}
        .term-title{margin-left:10px;color:var(--text);font-size:.8rem;opacity:.7}
        .terminal-body{flex:1;padding:14px 18px;overflow-y:auto;font-size:.95rem;line-height:1.7;color:var(--text);position:relative;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}
        .terminal-body::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,255,255,0.03)0px,rgba(0,255,255,0.03)1px,transparent 1px,transparent 3px);pointer-events:none;z-index:3}
        .output{white-space:pre-wrap;word-break:break-word;flex:1;z-index:1}
        .prompt{color:var(--prompt)}.cmd{color:var(--heading)}.out{color:var(--text)}.heading{color:var(--heading);font-weight:bold}.highlight{color:var(--highlight)}
        .input-line{display:flex;align-items:center;border-top:1px dashed var(--border);padding-top:10px;z-index:1;flex-shrink:0}
        #cmdInput{background:transparent;border:none;color:var(--text);font-family:inherit;font-size:inherit;flex:1;outline:none;caret-color:var(--prompt);margin-left:8px;-webkit-appearance:none;padding:4px 0}
        .status-bar{position:fixed;bottom:0;left:0;width:100%;height:24px;background:rgba(0,0,0,0.7);backdrop-filter:blur(5px);z-index:10;display:flex;align-items:center;justify-content:space-between;padding:0 15px;font-size:.7rem;color:var(--text);border-top:1px solid var(--border)}
        .contact-bar{position:fixed;bottom:30px;right:20px;display:flex;gap:12px;z-index:9;background:rgba(0,0,0,0.5);backdrop-filter:blur(8px);padding:6px 15px;border-radius:30px;border:1px solid var(--border)}
        .contact-icon{width:24px;height:24px;display:flex;align-items:center;justify-content:center;transition:.2s}
        .contact-icon:hover{transform:scale(1.15);filter:drop-shadow(0 0 6px var(--neon))}
        .contact-icon svg{width:20px;height:20px;fill:var(--prompt)}
        .util-buttons{position:fixed;top:15px;right:15px;z-index:10;display:flex;gap:8px;flex-wrap:wrap}
        .util-btn{background:rgba(0,0,0,0.6);border:1px solid var(--border);color:var(--text);padding:4px 10px;border-radius:15px;cursor:pointer;font-family:inherit;font-size:.75rem;transition:.2s}
        .util-btn:hover{background:var(--neon);color:#000}
        @media(max-width:600px){.terminal-wrapper{width:96%;max-height:75vh;top:45%}.terminal-body{font-size:.8rem;padding:10px}.contact-bar{bottom:20px;right:10px;gap:8px}.util-buttons{top:10px;right:10px}}
    </style>

    <script>
        (function() {
            // State
            const S = {
                sound: true, matrixActive: false, currentTheme: 'dark',
                commandHistory: [], historyIndex: -1, sectionsDone: new Set(),
                manual: false, typingQueue: [], typing: false, typingTimer: null, audioCtx: null
            };
            function loadSettings() {
                try {
                    const s = JSON.parse(localStorage.getItem('majid-term'));
                    if (s) { S.sound = s.sound ?? true; S.matrixActive = s.matrix ?? false; S.currentTheme = s.theme ?? 'dark'; }
                } catch(e) {}
                applySettings();
            }
            function saveSettings() { localStorage.setItem('majid-term', JSON.stringify({sound:S.sound, matrix:S.matrixActive, theme:S.currentTheme})); }
            function applySettings() {
                document.body.className = document.body.className.replace(/theme-\w+/g, '');
                document.body.classList.add('theme-' + S.currentTheme);
                document.getElementById('soundToggle').textContent = S.sound ? '🔊' : '🔇';
                document.getElementById('matrixToggle').textContent = S.matrixActive ? '⏃' : '⏃';
                if (S.matrixActive) startMatrix(); else stopMatrix();
            }
            window.setTheme = (t) => { S.currentTheme = t; applySettings(); saveSettings(); };
            window.toggleSound = () => { S.sound = !S.sound; applySettings(); saveSettings(); };
            window.toggleMatrix = () => { S.matrixActive = !S.matrixActive; applySettings(); saveSettings(); };

            // Audio
            function beep(f=800, d=0.05) {
                if (!S.sound) return;
                if (!S.audioCtx) S.audioCtx = new (window.AudioContext||window.webkitAudioContext)();
                const o = S.audioCtx.createOscillator(), g = S.audioCtx.createGain();
                o.type='square'; o.frequency.value=f; g.gain.value=0.08;
                o.connect(g); g.connect(S.audioCtx.destination); o.start(); o.stop(S.audioCtx.currentTime+d);
            }

            // Boot
            const bootLines = ["Booting Linux 5.15.0-majid...","Loading kernel modules... [OK]","Starting systemd... [OK]","Configuring network... [OK]","Decrypting portfolio...","Access Granted.","Welcome, Majid."];
            const bootDiv = document.getElementById('bootText'), bootScreen = document.getElementById('bootScreen');
            async function runBoot() {
                for (let line of bootLines) { await typeBoot(line, 35); }
                await new Promise(r => setTimeout(r, 500));
                bootScreen.classList.add('hidden');
            }
            function typeBoot(text, delay) {
                return new Promise(res => {
                    const p = document.createElement('div'); p.className='boot-line'; bootDiv.appendChild(p);
                    let i = 0;
                    const iv = setInterval(() => {
                        if (i < text.length) { p.textContent += text[i]; i++; beep(600, 0.02); }
                        else { clearInterval(iv); res(); }
                    }, delay);
                });
            }

            // Canvases
            const pCanvas = document.getElementById('particleCanvas'), pCtx = pCanvas.getContext('2d');
            const gCanvas = document.getElementById('gridCanvas'), gCtx = gCanvas.getContext('2d');
            const mCanvas = document.getElementById('matrixCanvas'), mCtx = mCanvas.getContext('2d');
            let particles = [], matrixChars = [], mInterval = null;
            function resizeCanvases() {
                pCanvas.width = gCanvas.width = mCanvas.width = window.innerWidth;
                pCanvas.height = gCanvas.height = mCanvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvases); resizeCanvases();
            for (let i=0;i<70;i++) particles.push({x:Math.random()*pCanvas.width,y:Math.random()*pCanvas.height,vx:(Math.random()-0.5)*0.5,vy:(Math.random()-0.5)*0.5,r:Math.random()*2+1});
            function drawParticles() {
                pCtx.clearRect(0,0,pCanvas.width,pCanvas.height);
                particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>pCanvas.width)p.vx*=-1;if(p.y<0||p.y>pCanvas.height)p.vy*=-1;pCtx.beginPath();pCtx.arc(p.x,p.y,p.r,0,Math.PI*2);pCtx.fillStyle='rgba(0,255,255,0.6)';pCtx.fill()});
                requestAnimationFrame(drawParticles);
            }
            function drawGrid() {
                gCtx.clearRect(0,0,gCanvas.width,gCanvas.height); gCtx.strokeStyle='rgba(0,255,255,0.08)'; gCtx.lineWidth=1;
                for(let x=0;x<gCanvas.width;x+=40){gCtx.beginPath();gCtx.moveTo(x,0);gCtx.lineTo(x,gCanvas.height);gCtx.stroke()}
                for(let y=0;y<gCanvas.height;y+=40){gCtx.beginPath();gCtx.moveTo(0,y);gCtx.lineTo(gCanvas.width,y);gCtx.stroke()}
                requestAnimationFrame(drawGrid);
            }
            function startMatrix() {
                mCanvas.style.display='block'; matrixChars=[];
                const chars='アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789';
                const fontSize=14, cols=mCanvas.width/fontSize;
                for(let i=0;i<cols;i++) matrixChars.push({x:i*fontSize,y:Math.random()*mCanvas.height,char:chars[Math.floor(Math.random()*chars.length)],speed:Math.random()*3+2});
                function draw(){mCtx.fillStyle='rgba(0,0,0,0.05)';mCtx.fillRect(0,0,mCanvas.width,mCanvas.height);mCtx.fillStyle='#0f0';mCtx.font=fontSize+'px monospace';matrixChars.forEach(c=>{mCtx.fillText(c.char,c.x,c.y);c.y+=c.speed;if(c.y>mCanvas.height){c.y=-fontSize;c.char=chars[Math.floor(Math.random()*chars.length)]}});mInterval=requestAnimationFrame(draw)}
                draw();
            }
            function stopMatrix() { mCanvas.style.display='none'; if(mInterval) cancelAnimationFrame(mInterval); }
            drawParticles(); drawGrid();

            // Terminal
            const outDiv = document.getElementById('output'), termBody = document.getElementById('terminalBody');
            const cmdInput = document.getElementById('cmdInput'), promptSign = document.getElementById('promptSign');

            const sectionsContent = [
                [{cls:'prompt',text:'guest@majid:~$'},{cls:'out',text:' cat about.txt\n'},{cls:'out',text:'Loading... [████████████] 100%\n\n'},{cls:'heading',text:'Majid\n'},{cls:'highlight',text:'Python Developer | Backend Developer | Cyber Security Enthusiast\n\n'},{cls:'out',text:'I build secure, scalable backend systems with Python.\nPassionate about open-source, automation, and ethical hacking.\n'},{cls:'out',text:'توسعه‌دهنده پایتون | عاشق امنیت سایبری\nکد می‌زنم، خلق می‌کنم.\n'},{cls:'prompt',text:'guest@majid:~$'}],
                [{cls:'prompt',text:'guest@majid:~$'},{cls:'out',text:' skills --list\n'},{cls:'out',text:'Initializing... [████████] 100%\n\n'},{cls:'heading',text:'Languages:'},{cls:'out',text:'  Python, JavaScript, Bash\n'},{cls:'heading',text:'Frameworks:'},{cls:'out',text:'  FastAPI, Django, Flask\n'},{cls:'heading',text:'Databases:'},{cls:'out',text:'  PostgreSQL, SQLite, Redis\n'},{cls:'prompt',text:'guest@majid:~$'}],
                [{cls:'prompt',text:'guest@majid:~$'},{cls:'out',text:' ls projects/\n'},{cls:'highlight',text:'telegram-superbot  HackerLab  Jamshid-AI  Portfolio\n\n'},{cls:'prompt',text:'guest@majid:~$'},{cls:'out',text:' cd HackerLab\n'},{cls:'prompt',text:'guest@majid:~/HackerLab$'},{cls:'out',text:' tree\n'},{cls:'out',text:'HackerLab/\n├── scanner.py\n├── exploit.py\n└── README.md\n'},{cls:'prompt',text:'guest@majid:~$'}],
                [{cls:'prompt',text:'guest@majid:~$'},{cls:'out',text:' whoami\n'},{cls:'heading',text:'Majid\n'},{cls:'out',text:'Python Developer\nBackend Developer\nOpen Source Enthusiast\n'},{cls:'out',text:'همیشه در حال ساختن چیزی...\n\n'},{cls:'prompt',text:'guest@majid:~$'},{cls:'out',text:' exit\n'},{cls:'out',text:'logout\nConnection Closed...\n'}]
            ];

            function addChar(cls, char) { const s=document.createElement('span'); s.className=cls; s.textContent=char; outDiv.appendChild(s); termBody.scrollTop=termBody.scrollHeight; }
            function stopType() { if(S.typingTimer){clearTimeout(S.typingTimer); S.typingTimer=null;} S.typing=false; }
            function typeSegs(segs, cb) {
                if(!segs||!segs.length){if(cb)cb();return}
                stopType(); let si=0, ci=0; S.typing=true;
                function next() {
                    if(si>=segs.length){S.typing=false;if(cb)cb();return}
                    const seg=segs[si];
                    if(ci>=seg.text.length){si++;ci=0;next();return}
                    addChar(seg.cls, seg.text[ci]); ci++; beep(800,0.02);
                    S.typingTimer=setTimeout(next, 15+Math.random()*10);
                }
                next();
            }
            function processQueue() {
                if(S.typingQueue.length && !S.typing && !S.manual){ const idx=S.typingQueue.shift(); startAuto(idx); }
            }
            function startAuto(idx) {
                if(S.sectionsDone.has(idx)||S.manual){processQueue();return}
                if(S.typing){S.typingQueue.push(idx);return}
                S.sectionsDone.add(idx); if(idx>0)addChar('out','\n');
                typeSegs(sectionsContent[idx], ()=>{ if(idx===3){cmdInput.disabled=false;cmdInput.focus()} processQueue(); });
            }

            const sections = document.querySelectorAll('.scroll-sections section');
            function getIdx(){ return Math.min(Math.round(document.getElementById('scrollContainer').scrollTop/window.innerHeight), sections.length-1); }
            let lastIdx=-1;
            function onScroll(){
                if(S.manual)return;
                const idx=getIdx(); if(idx!==lastIdx){lastIdx=idx; startAuto(idx);}
            }
            document.getElementById('scrollContainer').addEventListener('scroll', ()=>requestAnimationFrame(onScroll));

            // Command system
            const cmdList = ['help','about','skills','projects','contact','whoami','theme','clear','date','time','pwd','ls','cat','sudo','hack','matrix','coffee','hello','easteregg','history'];
            const cmdAliases = { '?':'help', 'who':'whoami', 'ls':'projects', 'list':'projects' };
            const cmdOutputs = {
                help: [{cls:'heading',text:'Available commands:\n'},{cls:'out',text:'about skills projects contact whoami theme clear date time pwd ls cat sudo hack matrix coffee hello easteregg history\n'}],
                about: sectionsContent[0].slice(1),
                skills: sectionsContent[1].slice(1),
                projects: sectionsContent[2].slice(1),
                whoami: [{cls:'heading',text:'Majid\n'},{cls:'out',text:'Python Developer | Backend Developer | Cyber Security Enthusiast\nهمیشه در حال ساختن چیزی...\n'}],
                date: [{cls:'out',text: new Date().toString()+'\n'}],
                time: [{cls:'out',text: new Date().toLocaleTimeString()+'\n'}],
                pwd: [{cls:'out',text:'/home/majid\n'}],
                ls: [{cls:'highlight',text:'telegram-superbot  HackerLab  Jamshid-AI  Portfolio\n'}],
                contact: [{cls:'out',text:'📡 Contact links below the terminal ↓\nGitHub | Telegram | Email | Resume\n'}],
                matrix: ()=>{ if(!S.matrixActive) toggleMatrix(); return [{cls:'out',text:'Entering Matrix...\n'}]; },
                hack: [{cls:'out',text:'Hacking mainframe...\n'},{cls:'highlight',text:'Access Granted.\n'}],
                coffee: [{cls:'out',text:'☕ Brewing coffee...\n'}],
                hello: [{cls:'heading',text:'Hello Majid! Welcome back.\n'}],
                easteregg: [{cls:'out',text:'You found an Easter Egg! 🥚\n'}],
                sudo: [{cls:'out',text:'Permission denied. Nice try! 😄\n'}],
                clear: 'CLEAR'
            };

            function getSuggestions(input) {
                const lower=input.toLowerCase();
                return cmdList.filter(c=>c.startsWith(lower) && c!==lower).slice(0,3);
            }

            function runCommand(raw) {
                const lower=raw.toLowerCase().trim();
                const cmd = cmdAliases[lower] || lower;
                if (cmd === 'clear') { outDiv.innerHTML=''; addChar('prompt','guest@majid:~$ '); cmdInput.disabled=false; cmdInput.focus(); return; }
                if (typeof cmdOutputs[cmd] === 'function') { typeSegs(cmdOutputs[cmd](), finishInput); return; }
                const segs = cmdOutputs[cmd] || null;
                if (segs) { typeSegs(segs, finishInput); }
                else {
                    const sug = getSuggestions(lower);
                    let msg = `command not found: ${lower}\n`;
                    if (sug.length) msg += `Did you mean: ${sug.join(', ')}?\n`;
                    typeSegs([{cls:'out',text:msg}], finishInput);
                }
            }
            function finishInput() { addChar('prompt','guest@majid:~$ '); cmdInput.disabled=false; cmdInput.focus(); }

            // Input handling
            cmdInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    const cmd = cmdInput.value.trim(); if (!cmd) return;
                    S.commandHistory.push(cmd); S.historyIndex = S.commandHistory.length;
                    cmdInput.value=''; cmdInput.disabled=true;
                    addChar('prompt','guest@majid:~$ '); addChar('out',cmd+'\n');
                    if (!S.manual) { S.manual=true; stopType(); S.typingQueue=[]; }
                    runCommand(cmd);
                } else if (e.key === 'Tab') {
                    e.preventDefault();
                    const val = cmdInput.value.trim().toLowerCase();
                    const sug = getSuggestions(val);
                    if (sug.length === 1) cmdInput.value = sug[0];
                    else if (sug.length > 1) { addChar('out','\n'+sug.join('  ')+'\n'); addChar('prompt','guest@majid:~$ '); cmdInput.value = val; }
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    if (S.commandHistory.length) {
                        S.historyIndex = Math.max(0, S.historyIndex - 1);
                        cmdInput.value = S.commandHistory[S.historyIndex] || '';
                    }
                } else if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    if (S.commandHistory.length) {
                        S.historyIndex = Math.min(S.commandHistory.length, S.historyIndex + 1);
                        cmdInput.value = S.commandHistory[S.historyIndex] || '';
                    }
                }
            });

            // Clock
            function updateClock() { document.getElementById('clockDisplay').textContent = new Date().toLocaleTimeString(); }
            setInterval(updateClock, 1000); updateClock();

            // Init
            window.addEventListener('load', async () => {
                loadSettings();
                await runBoot();
                S.manual=false; lastIdx=0;
                startAuto(0);
                cmdInput.disabled=true;
            });
        })();
    </script>
</body>
</html>
