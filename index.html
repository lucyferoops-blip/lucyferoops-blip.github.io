    <style>
        /* ========== CSS Variables (Themes) ========== */
        :root {
            --bg: #0a0a0f;
            --terminal-bg: rgba(10, 10, 25, 0.85);
            --border: rgba(0, 255, 255, 0.3);
            --text: #c0f0ff;
            --prompt: #0ff;
            --heading: #ff79c6;
            --highlight: #ffb86c;
            --neon: #0ff;
            --accent: #ff79c6;
            --transition-speed: 0.3s;
            font-size: 16px;
        }
        /* Theme Variations */
        .theme-hacker { --bg:#000; --terminal-bg:rgba(0,0,0,0.92); --border:#0f0; --text:#0f0; --prompt:#0f0; --heading:#0f0; --highlight:#0f0; --neon:#0f0; }
        .theme-cyberpunk { --bg:#0d0221; --terminal-bg:rgba(20,0,40,0.85); --border:#f0f; --text:#ffb3ff; --prompt:#f0f; --heading:#f0c; --highlight:#ff0; --neon:#f0f; }
        .theme-dracula { --bg:#282a36; --terminal-bg:rgba(40,42,54,0.9); --border:#bd93f9; --text:#f8f8f2; --prompt:#50fa7b; --heading:#ff79c6; --highlight:#f1fa8c; --neon:#bd93f9; }
        .theme-nord { --bg:#2e3440; --terminal-bg:rgba(46,52,64,0.9); --border:#88c0d0; --text:#d8dee9; --prompt:#81a1c1; --heading:#b48ead; --highlight:#ebcb8b; --neon:#88c0d0; }
        .theme-tokyonight { --bg:#1a1b27; --terminal-bg:rgba(26,27,39,0.9); --border:#7aa2f7; --text:#c0caf5; --prompt:#7dcfff; --heading:#bb9af7; --highlight:#e0af68; --neon:#7aa2f7; }

        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg);
            font-family: 'Vazir Code', 'Fira Code', 'Consolas', monospace;
            height: 100vh; overflow: hidden; /* we manage scroll via sections */
            position: relative;
            -webkit-tap-highlight-color: transparent;
            transition: background var(--transition-speed), color var(--transition-speed);
            will-change: background;
        }
        /* ========== Boot Screen ========== */
        #bootScreen {
            position: fixed; inset: 0; background: #000; color: #0f0;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1000; font-family: 'Courier New', monospace; transition: opacity 0.8s;
            pointer-events: all; padding: 20px; text-align: left; font-size: 0.9rem;
        }
        #bootScreen.hidden { opacity:0; pointer-events:none; }
        .boot-line { white-space: pre-wrap; margin: 2px 0; }

        /* ========== Main Canvas Layers ========== */
        .canvas-layer { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none; }
        #particleCanvas { opacity:0.6; }
        #gridCanvas { opacity:0.15; }
        #matrixCanvas { display:none; }

        /* ========== Scroll Sections (invisible triggers) ========== */
        .scroll-container { position: fixed; top:0; left:0; width:100%; height:100%; overflow-y: auto; z-index:1; -webkit-overflow-scrolling: touch; }
        .scroll-sections { height: 100%; }
        .scroll-sections section { height: 100vh; width: 100%; pointer-events: auto; }

        /* ========== Terminal ========== */
        .terminal-wrapper {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: min(92%, 900px); max-height: 80vh; z-index:2;
            display: flex; flex-direction: column; background: var(--terminal-bg);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: 16px;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.15);
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .terminal-header {
            display: flex; align-items: center; padding: 10px 16px;
            background: rgba(0,0,0,0.4); border-bottom: 1px solid var(--border);
            gap: 8px; flex-shrink: 0;
        }
        .win-btn { width:12px; height:12px; border-radius:50%; }
        .close { background:#ff5f56; } .minimize { background:#ffbd2e; } .maximize { background:#27ca40; }
        .term-title { margin-left:10px; color:var(--text); font-size:0.8rem; opacity:0.7; }

        .terminal-body {
            flex:1; padding:14px 18px; overflow-y:auto; font-size:0.95rem; line-height:1.7;
            color:var(--text); position:relative; display:flex; flex-direction:column;
            -webkit-overflow-scrolling:touch; scroll-behavior:smooth;
        }
        .terminal-body::after { /* scanline */
            content:""; position:absolute; inset:0;
            background: repeating-linear-gradient(0deg, rgba(0,255,255,0.03) 0px, rgba(0,255,255,0.03) 1px, transparent 1px, transparent 3px);
            pointer-events:none; z-index:3;
        }
        .output { white-space:pre-wrap; word-break:break-word; flex:1; z-index:1; }
        .prompt { color:var(--prompt); }
        .cmd { color:var(--accent); }
        .out { color:var(--text); }
        .heading { color:var(--heading); font-weight:bold; }
        .highlight { color:var(--highlight); }

        .input-line { display:flex; align-items:center; border-top:1px dashed var(--border); padding-top:10px; z-index:1; flex-shrink:0; }
        #cmdInput {
            background:transparent; border:none; color:var(--text); font-family:inherit; font-size:inherit;
            flex:1; outline:none; caret-color:var(--prompt); margin-left:8px;
            -webkit-appearance:none; padding:4px 0;
        }

        /* ========== UI Elements ========== */
        .status-bar {
            position: fixed; bottom:0; left:0; width:100%; height:24px; background:rgba(0,0,0,0.7);
            backdrop-filter:blur(5px); z-index:10; display:flex; align-items:center; justify-content:space-between;
            padding:0 15px; font-size:0.7rem; color:var(--text); border-top:1px solid var(--border);
        }
        .contact-bar {
            position: fixed; bottom: 30px; right: 20px; display:flex; gap:12px; z-index:9;
            background:rgba(0,0,0,0.5); backdrop-filter:blur(8px); padding:6px 15px; border-radius:30px;
            border:1px solid var(--border);
        }
        .contact-icon { width:24px; height:24px; display:flex; align-items:center; justify-content:center; transition:0.2s; }
        .contact-icon:hover { transform:scale(1.15); filter:drop-shadow(0 0 6px var(--neon)); }
        .contact-icon svg { width:20px; height:20px; fill:var(--prompt); }

        .util-buttons { position:fixed; top:15px; right:15px; z-index:10; display:flex; gap:8px; flex-wrap:wrap; }
        .util-btn {
            background:rgba(0,0,0,0.6); border:1px solid var(--border); color:var(--text); padding:4px 10px;
            border-radius:15px; cursor:pointer; font-family:inherit; font-size:0.75rem; transition:0.2s;
        }
        .util-btn:hover { background:var(--neon); color:#000; }

        @media (max-width:600px) {
            .terminal-wrapper { width:96%; max-height:75vh; top:45%; }
            .terminal-body { font-size:0.8rem; padding:10px; }
            .contact-bar { bottom:20px; right:10px; gap:8px; }
            .util-buttons { top:10px; right:10px; }
        }
