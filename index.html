<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Majid Dev | Interactive Terminal Portfolio</title>
    <style>
        :root {
            --neon-primary: #0ff;
            --neon-secondary: #c200ff;
            --glow-color: rgba(0, 255, 255, 0.6);
            --bg-color: #0a0a0f;
            --text-color: #c0f0ff;
            --heading-color: #ff79c6;
            --highlight-color: #ffb86c;
            --prompt-color: #0ff;
            --progress-bg: #1a1a2e;
            --progress-fill: #0ff;
            --terminal-bg: rgba(10, 10, 25, 0.75);
            --border-glow: rgba(0, 255, 255, 0.3);
            --hover-glow: rgba(0, 255, 255, 0.3);
            --noise-opacity: 0.03;
            --crt-opacity: 0.08;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-color);
            font-family: 'Fira Code', 'Courier New', monospace;
            overflow-x: hidden;
            height: 100vh;
            position: relative;
            cursor: default;
        }

        .mouse-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(circle 300px at var(--mouse-x, 0) var(--mouse-y, 0), rgba(0, 255, 255, 0.08), transparent 70%);
            transition: opacity 0.3s;
        }

        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: var(--noise-opacity);
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.4'/%3E%3C/svg%3E");
            background-size: 200px 200px;
        }

        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .scroll-sections {
            position: relative;
            z-index: 1;
            pointer-events: none;
        }

        .scroll-sections section {
            height: 100vh;
            width: 100%;
            pointer-events: auto;
        }

        .terminal-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(90%, 850px);
            max-height: 80vh;
            background: var(--terminal-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.15), 0 0 15px rgba(200, 0, 255, 0.2);
            z-index: 2;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: transform 0.3s ease, filter 0.3s ease, box-shadow 0.3s, border-color 0.3s;
        }

        .terminal-container:hover {
            box-shadow: 0 0 50px var(--hover-glow), 0 0 25px rgba(200, 0, 255, 0.4);
            border-color: rgba(200, 0, 255, 0.6);
        }

        .section-transition {
            transform: translate(-50%, -50%) scale(0.98) rotate(0.5deg);
            filter: blur(1px);
            opacity: 0.8;
        }

        .terminal-header {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: rgba(20, 20, 35, 0.7);
            border-bottom: 1px solid var(--border-glow);
            gap: 8px;
        }

        .btn {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: inline-block;
        }

        .close { background: #ff5f56; }
        .minimize { background: #ffbd2e; }
        .maximize { background: #27ca40; }

        .title {
            margin-left: 12px;
            color: #a0b0ff;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        .terminal-body {
            flex: 1;
            padding: 16px 20px;
            overflow-y: auto;
            font-size: 1rem;
            line-height: 1.6;
            color: var(--text-color);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .terminal-body::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0, 255, 255, 0.03) 0px, rgba(0, 255, 255, 0.03) 1px, transparent 1px, transparent 3px);
            pointer-events: none;
            z-index: 3;
            opacity: var(--crt-opacity);
        }

        .output {
            white-space: pre-wrap;
            word-break: break-word;
            flex: 1;
            position: relative;
            z-index: 1;
        }

        .prompt-text {
            color: var(--prompt-color);
            text-shadow: 0 0 8px var(--glow-color);
        }

        .output-text {
            color: var(--text-color);
        }

        .heading {
            color: var(--heading-color);
            font-weight: bold;
            text-shadow: 0 0 6px var(--heading-color);
        }

        .highlight {
            color: var(--highlight-color);
        }

        .glitch {
            display: inline-block;
            animation: glitch 1.5s infinite linear alternate-reverse;
        }

        @keyframes glitch {
            0% { text-shadow: 2px 2px 0 #ff00c1, -2px -2px 0 #00ffff; }
            20% { text-shadow: -2px 2px 0 #ff00c1, 2px -2px 0 #00ffff; }
            40% { text-shadow: 2px -2px 0 #ff00c1, -2px 2px 0 #00ffff; }
            60% { text-shadow: -2px -2px 0 #ff00c1, 2px 2px 0 #00ffff; }
            80% { text-shadow: 2px 2px 0 #00ffff, -2px -2px 0 #ff00c1; }
            100% { text-shadow: 2px -2px 0 #00ffff, -2px 2px 0 #ff00c1; }
        }

        .terminal-container {
            animation: flicker 0.15s infinite alternate;
        }

        @keyframes flicker {
            0% { opacity: 0.98; }
            100% { opacity: 1; }
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 2px 0;
        }
        .progress-label {
            color: var(--text-color);
            white-space: nowrap;
            min-width: 160px;
        }
        .progress-bar {
            flex: 1;
            height: 1.2em;
            background: var(--progress-bg);
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid rgba(0,255,255,0.2);
        }
        .progress-fill {
            height: 100%;
            width: 0;
            background: var(--progress-fill);
            border-radius: 3px;
            transition: width 1.2s ease-out;
            box-shadow: 0 0 10px var(--glow-color);
        }

        .scroll-indicator {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            color: rgba(0, 255, 255, 0.7);
            font-family: 'Fira Code', monospace;
            text-align: center;
            animation: bounce 1.5s infinite;
            transition: opacity 0.5s;
            pointer-events: none;
            font-size: 0.9rem;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-8px); }
        }

        /* Telegram float top left */
        .telegram-float {
            position: fixed;
            top: 24px;
            left: 24px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(10, 10, 25, 0.8);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 255, 255, 0.4);
            border-radius: 50px;
            padding: 10px 20px 10px 16px;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.25), 0 0 10px rgba(200, 0, 255, 0.2);
            transition: all 0.3s ease;
            text-decoration: none;
            color: var(--neon-primary);
            font-family: 'Fira Code', monospace;
        }

        .telegram-float:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 35px rgba(0, 255, 255, 0.5), 0 0 20px rgba(200, 0, 255, 0.4);
            border-color: rgba(0, 255, 255, 0.8);
        }

        .telegram-icon {
            width: 28px;
            height: 28px;
            fill: currentColor;
            filter: drop-shadow(0 0 6px var(--glow-color));
            transition: transform 0.2s;
        }

        .telegram-float:hover .telegram-icon {
            transform: scale(1.15);
        }

        .telegram-handle {
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 0 10px var(--glow-color);
            margin-left: 2px;
        }

        @media (max-width: 600px) {
            .telegram-float {
                top: 16px;
                left: 16px;
                padding: 8px 16px;
                gap: 6px;
            }
            .telegram-icon {
                width: 22px;
                height: 22px;
            }
            .telegram-handle {
                font-size: 0.85rem;
            }
            .terminal-container {
                width: 95%;
                max-height: 75vh;
            }
            .terminal-body {
                font-size: 0.85rem;
                padding: 12px;
            }
            .scroll-indicator {
                bottom: 20px;
                font-size: 0.8rem;
            }
            .progress-label {
                min-width: 120px;
            }
        }
    </style>
</head>
<body>
    <div class="mouse-glow" id="mouseGlow"></div>
    <div class="noise-overlay"></div>
    <canvas id="particleCanvas"></canvas>

    <!-- Telegram floating icon top left -->
    <a href="https://t.me/M4j1D_0xDEAD" target="_blank" class="telegram-float" title="ارتباط در تلگرام">
        <svg class="telegram-icon" viewBox="0 0 24 24">
            <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
        </svg>
        <span class="telegram-handle">@M4j1D_0xDEAD</span>
    </a>

    <div class="scroll-indicator" id="scrollIndicator">▼ Scroll Down</div>

    <div class="scroll-sections">
        <section data-index="0"></section>
        <section data-index="1"></section>
        <section data-index="2"></section>
        <section data-index="3"></section>
    </div>

    <div class="terminal-container" id="terminalContainer">
        <div class="terminal-header">
            <span class="btn close"></span>
            <span class="btn minimize"></span>
            <span class="btn maximize"></span>
            <span class="title">majid@portfolio — bash — 80×24</span>
        </div>
        <div class="terminal-body" id="terminalBody">
            <div class="output" id="output"></div>
        </div>
    </div>

    <script>
        (function() {
            // ---------- Mouse glow ----------
            const mouseGlow = document.getElementById('mouseGlow');
            document.addEventListener('mousemove', (e) => {
                mouseGlow.style.setProperty('--mouse-x', e.clientX + 'px');
                mouseGlow.style.setProperty('--mouse-y', e.clientY + 'px');
            });

            // ---------- Scrolling Code Background ----------
            const canvas = document.getElementById('particleCanvas');
            const ctx = canvas.getContext('2d');
            let width, height;
            let lines = [];

            function resizeCanvas() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
                initLines();
            }
            window.addEventListener('resize', resizeCanvas);

            function generateRandomLine() {
                const prefixes = [
                    '[INFO]', '[WARN]', '[DEBUG]', '[LOG]', 'root@server:~#', 
                    'guest@majid:~$', '>>>', '...', 'OK', 'FAIL', '200', '404',
                    'import', 'def', 'class', 'return', 'if __name__'
                ];
                const suffixes = [
                    'Processing...', 'Done.', 'Connection established.', 'Loading module...',
                    'Syntax error near line 42.', 'Task completed successfully.',
                    'fetching data from api.github.com', 'Running security scan...',
                    'Open port 443 detected.', 'Encrypting payload...',
                    'Decrypting response...', 'Access granted.', 'Permission denied.',
                    'Uploading 4.2MB...', 'Downloading 6.7MB...', 'Cache cleared.',
                    'Server response: 200 OK', 'Memory usage: 78%', 'CPU load: 45%',
                    'Listening on 0.0.0.0:8080', 'User authenticated.'
                ];
                const prefix = prefixes[Math.floor(Math.random() * prefixes.length)];
                const suffix = suffixes[Math.floor(Math.random() * suffixes.length)];
                return `${prefix} ${suffix}`;
            }

            function initLines() {
                const fontSize = 13;
                const lineHeight = fontSize * 1.4;
                const numLines = Math.floor(height / lineHeight) + 5;
                lines = [];
                for (let i = 0; i < numLines; i++) {
                    lines.push({
                        text: generateRandomLine(),
                        y: i * lineHeight,
                        speed: 0.3 + Math.random() * 0.7,
                        x: 10 + Math.random() * 30,
                        opacity: 0.05 + Math.random() * 0.15,
                        fontSize: fontSize
                    });
                }
            }

            function updateAndDrawLines() {
                ctx.clearRect(0, 0, width, height);
                const fontSize = 13;
                const lineHeight = fontSize * 1.4;
                ctx.font = `${fontSize}px 'Fira Code', monospace`;
                
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i];
                    line.y -= line.speed;
                    if (line.y + lineHeight < 0) {
                        line.y = height + Math.random() * 50;
                        line.text = generateRandomLine();
                        line.speed = 0.3 + Math.random() * 0.7;
                        line.opacity = 0.05 + Math.random() * 0.15;
                    }
                    ctx.fillStyle = `rgba(0, 255, 255, ${line.opacity})`;
                    ctx.fillText(line.text, line.x, line.y);
                }
                requestAnimationFrame(updateAndDrawLines);
            }

            resizeCanvas();
            updateAndDrawLines();

            // ---------- Terminal typewriter ----------
            const outputDiv = document.getElementById('output');
            const terminalBody = document.getElementById('terminalBody');
            const terminalContainer = document.getElementById('terminalContainer');
            const scrollIndicator = document.getElementById('scrollIndicator');
            let typingTimeout = null;
            const completedSections = new Set();

            function appendChar(cls, char) {
                const span = document.createElement('span');
                span.className = cls;
                span.textContent = char;
                outputDiv.appendChild(span);
            }

            function appendElement(element) {
                outputDiv.appendChild(element);
            }

            function typeSegments(segments, onComplete) {
                if (!segments || segments.length === 0) {
                    if (onComplete) onComplete();
                    return;
                }
                let segIdx = 0;
                let charIdx = 0;

                function nextChar() {
                    if (segIdx >= segments.length) {
                        if (onComplete) onComplete();
                        return;
                    }
                    const seg = segments[segIdx];

                    if (seg.type === 'progress') {
                        const container = document.createElement('div');
                        container.className = 'progress-container';
                        const label = document.createElement('span');
                        label.className = 'progress-label';
                        label.textContent = seg.label;
                        const bar = document.createElement('div');
                        bar.className = 'progress-bar';
                        const fill = document.createElement('div');
                        fill.className = 'progress-fill';
                        bar.appendChild(fill);
                        container.appendChild(label);
                        container.appendChild(bar);
                        appendElement(container);
                        setTimeout(() => {
                            fill.style.width = seg.percent + '%';
                        }, 10);
                        segIdx++;
                        charIdx = 0;
                        setTimeout(nextChar, 200);
                        return;
                    }

                    if (charIdx >= seg.text.length) {
                        segIdx++;
                        charIdx = 0;
                        const delay = seg.nextDelay || 0;
                        if (delay > 0) {
                            setTimeout(nextChar, delay);
                        } else {
                            nextChar();
                        }
                        return;
                    }
                    const ch = seg.text[charIdx];
                    appendChar(seg.cls, ch);
                    charIdx++;
                    terminalBody.scrollTop = terminalBody.scrollHeight;
                    const speed = seg.speed || 18;
                    typingTimeout = setTimeout(nextChar, speed);
                }
                nextChar();
            }

            function stopTyping() {
                if (typingTimeout) {
                    clearTimeout(typingTimeout);
                    typingTimeout = null;
                }
            }

            const sectionsContent = [
                // بخش ۰: بوت و درباره
                [
                    { cls: 'output-text', text: 'Booting Portfolio OS...\n', speed: 30, nextDelay: 200 },
                    { cls: 'output-text', text: '[ OK ] Loading profile\n', speed: 20, nextDelay: 100 },
                    { cls: 'output-text', text: '[ OK ] Connecting GitHub\n', speed: 20, nextDelay: 100 },
                    { cls: 'output-text', text: '[ OK ] Initializing Portfolio\n\n', speed: 20, nextDelay: 300 },
                    { cls: 'prompt-text', text: 'guest@majid:~$' },
                    { cls: 'output-text', text: ' cat about.txt\n', speed: 18 },
                    { cls: 'heading glitch', text: 'Majid\n', speed: 18 },
                    { cls: 'highlight', text: 'Python Developer | Backend Developer | Cyber Security Enthusiast\n\n', speed: 18 },
                    { cls: 'output-text', text: 'I build secure, scalable backend systems with Python.\nPassionate about open-source, automation, and ethical hacking.\nTurning coffee into code since forever.\n', speed: 18 },
                    { cls: 'prompt-text', text: 'guest@majid:~$' }
                ],
                // بخش ۱: مهارت‌ها
                [
                    { cls: 'prompt-text', text: 'guest@majid:~$' },
                    { cls: 'output-text', text: ' skills --verbose\n', speed: 18 },
                    { cls: 'output-text', text: 'Scanning skill matrix...\n\n', speed: 18, nextDelay: 200 },
                    { type: 'progress', label: 'Python         ', percent: 95 },
                    { type: 'progress', label: 'FastAPI        ', percent: 90 },
                    { type: 'progress', label: 'Linux          ', percent: 85 },
                    { type: 'progress', label: 'Docker         ', percent: 80 },
                    { type: 'progress', label: 'Cyber Security ', percent: 85 },
                    { type: 'progress', label: 'Git/GitHub     ', percent: 92 },
                    { cls: 'output-text', text: '\n', speed: 5 },
                    { cls: 'prompt-text', text: 'guest@majid:~$' }
                ],
                // بخش ۲: پروژه‌ها
                [
                    { cls: 'prompt-text', text: 'guest@majid:~$' },
                    { cls: 'output-text', text: ' ls projects/\n', speed: 18 },
                    { cls: 'highlight', text: 'telegram-superbot  HackerLab  Jamshid-AI  Portfolio\n\n', speed: 18 },
                    { cls: 'prompt-text', text: 'guest@majid:~$' },
                    { cls: 'output-text', text: ' cd HackerLab\n', speed: 18 },
                    { cls: 'prompt-text', text: 'guest@majid:~/HackerLab$' },
                    { cls: 'output-text', text: ' tree\n', speed: 18 },
                    { cls: 'output-text', text: 'HackerLab/\n├── app/\n├── modules/\n├── scanners/\n├── reports/\n├── utils/\n├── config/\n├── requirements.txt\n├── README.md\n└── main.py\n\n', speed: 18 },
                    { cls: 'output-text', text: 'A modular Python project for security analysis and automation.\n', speed: 18 },
                    { cls: 'prompt-text', text: 'guest@majid:~$' }
                ],
                // بخش ۳: whoami با اطلاعات کامل و وضعیت
                [
                    { cls: 'prompt-text', text: 'guest@majid:~$' },
                    { cls: 'output-text', text: ' whoami\n', speed: 18 },
                    { cls: 'heading', text: 'Majid\n', speed: 18 },
                    { cls: 'output-text', text: 'Python Developer\nBackend Developer\nCyber Security Enthusiast\n\n', speed: 18 },
                    { cls: 'output-text', text: 'Status: ONLINE\n', speed: 18 },
                    { cls: 'output-text', text: 'Available for Freelance Projects\n', speed: 18 },
                    { cls: 'output-text', text: 'Open to Remote Collaboration\n', speed: 18 },
                    { cls: 'output-text', text: 'Always Building Something...\n\n', speed: 18 },
                    { cls: 'prompt-text', text: 'guest@majid:~$' }
                ]
            ];

            function startAutoSection(index) {
                if (completedSections.has(index)) return;
                stopTyping();
                const content = sectionsContent[index];
                if (index > 0) {
                    appendChar('output-text', '\n');
                }
                typeSegments(content, () => {
                    completedSections.add(index);
                });
            }

            const sections = document.querySelectorAll('.scroll-sections section');
            function getCurrentIndex() {
                const scrollY = window.scrollY;
                const vh = window.innerHeight;
                const index = Math.round(scrollY / vh);
                return Math.min(index, sections.length - 1);
            }

            let lastSection = -1;
            function handleScroll() {
                const idx = getCurrentIndex();
                if (idx !== lastSection) {
                    stopTyping();
                    terminalContainer.classList.add('section-transition');
                    setTimeout(() => terminalContainer.classList.remove('section-transition'), 300);
                    lastSection = idx;
                    startAutoSection(idx);
                }
                scrollIndicator.style.opacity = window.scrollY > 50 ? '0' : '1';
            }

            window.addEventListener('load', () => {
                window.scrollTo(0, 0);
                lastSection = 0;
                startAutoSection(0);
            });

            let ticking = false;
            window.addEventListener('scroll', () => {
                if (!ticking) {
                    window.requestAnimationFrame(() => {
                        handleScroll();
                        ticking = false;
                    });
                    ticking = true;
                }
            });
        })();
    </script>
</body>
</html>
